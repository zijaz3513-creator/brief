<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a" id="themeColor">
<title>Morning Brief</title>
<script>
/* Apply the saved theme before first paint (no flash). */
(function () {
  try {
    var m = localStorage.getItem('mb:theme');
    if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-theme', m);
  } catch (e) {}
})();
</script>
<style>
:root{
  --bg:#f1f1f1;--surface:#ffffff;--text:#303030;--sub:#616161;--border:#e3e3e3;--hair:#ebebeb;
  --primary:#008060;--primary-h:#006e52;--on-primary:#ffffff;--link:#005bd3;
  --badge-bg:#cdfee1;--badge-fg:#0c5132;--badge2-bg:#f1f1f1;--badge2-fg:#616161;
  --top:#1a1a1a;--top-text:#ffffff;--field:#ffffff;--chip:#e8e8e8;--chip-on:#1a1a1a;--chip-on-text:#ffffff;
}
:root[data-theme="dark"]{
  --bg:#1a1a1a;--surface:#2a2a2a;--text:#e3e3e3;--sub:#b5b5b5;--border:#454545;--hair:#383838;
  --primary:#29845a;--primary-h:#2f9a6a;--on-primary:#ffffff;--link:#91d0ff;
  --badge-bg:#17503a;--badge-fg:#a6ecc8;--badge2-bg:#3a3a3a;--badge2-fg:#b5b5b5;
  --top:#0f0f0f;--top-text:#ffffff;--field:#1f1f1f;--chip:#333333;--chip-on:#e3e3e3;--chip-on-text:#1a1a1a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#1a1a1a;--surface:#2a2a2a;--text:#e3e3e3;--sub:#b5b5b5;--border:#454545;--hair:#383838;
    --primary:#29845a;--primary-h:#2f9a6a;--on-primary:#ffffff;--link:#91d0ff;
    --badge-bg:#17503a;--badge-fg:#a6ecc8;--badge2-bg:#3a3a3a;--badge2-fg:#b5b5b5;
    --top:#0f0f0f;--top-text:#ffffff;--field:#1f1f1f;--chip:#333333;--chip-on:#e3e3e3;--chip-on-text:#1a1a1a;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"San Francisco","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:var(--link);text-decoration:none}

.top{position:sticky;top:0;z-index:20;background:var(--top);color:var(--top-text);
  display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.brand{display:flex;align-items:center;gap:10px;flex:1;font-weight:650;font-size:15px;min-width:0}
.logo{width:28px;height:28px;border-radius:8px;background:var(--primary);display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px;stroke:#fff}
.icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--top-text)}
.icon:active,.icon:hover{background:rgba(255,255,255,.12)}
.icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{border-radius:10px;padding:8px 14px;font-weight:600;border:1px solid transparent;min-height:38px}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}
.btn.primary:hover{background:var(--primary-h)}
.btn.secondary{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn:disabled{opacity:.55;cursor:default}

.tabs{position:sticky;top:calc(env(safe-area-inset-top) + 54px);z-index:15;background:var(--bg);
  display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 14px;border-radius:999px;background:var(--chip);color:var(--text);font-weight:550;font-size:13px}
.tab.on{background:var(--chip-on);color:var(--chip-on-text)}

main{max-width:760px;margin:0 auto;padding:4px 12px 48px}
.pagehead{padding:6px 4px 12px}
.pagehead h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.01em}
.pagehead p{margin:2px 0 0;color:var(--sub);font-size:13px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden;
  box-shadow:0 1px 0 rgba(26,26,26,.05)}
.card>header{display:flex;align-items:center;gap:8px;padding:14px 16px;cursor:pointer;user-select:none}
.card>header h2{margin:0;font-size:15px;font-weight:650;flex:1}
.card>header .state{color:var(--sub);font-size:12px}
.card>header .chev{width:18px;height:18px;stroke:var(--sub);fill:none;stroke-width:2;transition:transform .15s}
.card.collapsed .chev{transform:rotate(-90deg)}
.card.collapsed .body{display:none}
.body{border-top:1px solid var(--hair);padding:0 0 6px}
.group{padding:12px 16px 2px}
.group h3{margin:0;font-size:13px;font-weight:650}
.group .src{color:var(--sub);font-size:12px;margin-top:1px}
.rows{list-style:none;margin:6px 0 4px;padding:0}
.rows li{padding:10px 0;border-top:1px solid var(--hair)}
.rows li:first-child{border-top:0}
.rows a{color:var(--text);font-weight:550;font-size:14px;word-break:break-word}
.rows a:active,.rows a:hover{color:var(--link)}
.sub{color:var(--sub);font-size:12.5px;margin-top:2px}
.badge{display:inline-block;margin-top:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--badge-bg);color:var(--badge-fg)}
.badge.none{background:var(--badge2-bg);color:var(--badge2-fg);font-weight:500}
.note{color:var(--sub);font-size:12px;margin:10px 16px 4px}
.empty{color:var(--sub);padding:16px;font-size:13px}
.loading{color:var(--sub);padding:16px;font-size:13px}

#settings{display:none;padding:16px}
#settings h2{margin:0 0 4px;font-size:15px}
#settings label{display:block;font-size:12.5px;margin:14px 0 6px;color:var(--sub);font-weight:550}
#settings input[type=text]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--field);color:var(--text);font-size:15px}
#settings input[type=text]:focus{outline:2px solid var(--primary);outline-offset:0}
#settings .hint{color:var(--sub);font-size:12px;margin:6px 0 0}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{padding:8px 16px;font-size:13px;font-weight:550;background:var(--surface);color:var(--text)}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--primary);color:#fff}
.row-actions{margin-top:16px;display:flex;gap:8px}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="4"/><path d="M12 3v2M4.2 7.2l1.4 1.4M19.8 7.2l-1.4 1.4M2 13h2M20 13h2"/></svg></span>
    <span>Morning Brief</span>
  </div>
  <button class="icon" id="theme" aria-label="Switch light or dark theme"></button>
  <button class="icon" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <button class="btn primary" id="refresh">Refresh</button>
</header>

<nav class="tabs" id="tabs">
  <button class="tab on" data-tab="all">All</button>
  <button class="tab" data-tab="social">Social</button>
  <button class="tab" data-tab="tech">AI &amp; Tech</button>
  <button class="tab" data-tab="sell">To sell</button>
  <button class="tab" data-tab="jobs">Jobs</button>
  <button class="tab" data-tab="crypto">Crypto</button>

<main>
  <div class="pagehead">
    <h1 id="greet">Good morning</h1>
    <p id="stamp">Loading…</p>
  </div>

  <div class="card" id="settings">
    <h2>Settings</h2>
    <label>Appearance</label>
    <div class="seg" id="seg">
      <button data-mode="system">System</button>
      <button data-mode="light">Light</button>
      <button data-mode="dark">Dark</button>
    </div>
    <label for="geo">Country code (Google Trends and YouTube)</label>
    <input type="text" id="geo" maxlength="2" autocapitalize="characters">
    <label for="ytkey">YouTube Data API key (optional, free)</label>
    <input type="text" id="ytkey" autocapitalize="none" autocomplete="off" autocorrect="off">
    <p class="hint">Without a key, YouTube shows news coverage instead of the live chart.</p>
    <div class="row-actions">
      <button class="btn primary" id="save">Save</button>
      <button class="btn secondary" id="cancel">Close</button>
    </div>
  </div>

  <div id="out"></div>
</main>

<script>
/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const decode = (s) => { const t = document.createElement('textarea'); t.innerHTML = String(s ?? ''); return t.value; };
const stripTags = (s) => decode(String(s ?? '').replace(/<[^>]*>/g, '')).trim();

/* English only: drop anything written in a non-Latin script (Arabic, Hebrew, Cyrillic, CJK, Indic, ...). */
const NON_LATIN = /[Ͱ-ԯ֐-ࣿऀ-෿฀-໿က-႟぀-ヿ㐀-䶿一-鿿가-힯]/;
const isEnglish = (s) => !NON_LATIN.test(String(s ?? ''));

function settings() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem('mb:settings') || '{}'); } catch (e) {}
  return { geo: (s.geo || 'KW').toUpperCase(), ytkey: s.ytkey || '' };
}

async function http(url, headers) {
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = new Promise((_, rej) => setTimeout(() => { if (ctl) ctl.abort(); rej(new Error('timeout')); }, 20000));
  const req = (async () => {
    const r = await fetch(url, { headers: headers || {}, signal: ctl ? ctl.signal : undefined });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.text();
  })();
  return Promise.race([req, timer]);
}
async function httpGet(url, headers) { try { return await http(url, headers); } catch (e) { return null; } }
async function httpJson(url, headers) {
  const t = await httpGet(url, headers);
  if (!t) return null;
  try { return JSON.parse(t); } catch (e) { return null; }
}
const item = (title, url = '', meta = '', badge = '', badgeNone = false) =>
  ({ title: stripTags(title), url, meta, badge, badgeNone });
const group = (name, source, items) => ({ name, source, items: (items || []).filter((i) => isEnglish(i.title)) });
const uniqBy = (arr, key) => { const seen = new Set(); return arr.filter((x) => { const k = key(x); if (seen.has(k)) return false; seen.add(k); return true; }); };

/* RSS / Atom. Google Trends items get a real news link and an English headline. */
async function rss(url, limit = 8) {
  const x = await httpGet(url);
  if (!x) return [];
  const doc = new DOMParser().parseFromString(x, 'text/xml');
  if (doc.getElementsByTagName('parsererror').length) return [];
  let nodes = Array.from(doc.getElementsByTagName('item'));
  if (!nodes.length) nodes = Array.from(doc.getElementsByTagName('entry'));
  const out = [];
  for (const n of nodes) {
    const t = n.getElementsByTagName('title')[0];
    const title = t ? t.textContent.trim() : '';
    if (!isEnglish(title)) continue;
    const l = n.getElementsByTagName('link')[0];
    let link = '';
    if (l) link = (l.textContent || '').trim() || l.getAttribute('href') || '';
    const tr = n.getElementsByTagName('ht:approx_traffic')[0];
    let meta = tr ? tr.textContent.trim() + ' searches' : '';
    if (tr) {
      let pick = null;
      for (const e of Array.from(n.getElementsByTagName('ht:news_item'))) {
        const tt = e.getElementsByTagName('ht:news_item_title')[0];
        const uu = e.getElementsByTagName('ht:news_item_url')[0];
        if (!uu || !uu.textContent.trim()) continue;
        const cand = { title: tt ? stripTags(tt.textContent) : '', url: uu.textContent.trim() };
        if (!pick || (isEnglish(cand.title) && !isEnglish(pick.title))) pick = cand;
        if (isEnglish(cand.title)) break;
      }
      link = pick ? pick.url : 'https://www.google.com/search?q=' + encodeURIComponent(title);
      if (pick && pick.title && isEnglish(pick.title)) {
        meta += ' · ' + (pick.title.length > 90 ? pick.title.slice(0, 87) + '…' : pick.title);
      }
    }
    out.push(item(title, link, meta));
    if (out.length >= limit) break;
  }
  return out;
}
const news = (q, limit = 6) => rss('https://news.google.com/rss/search?q=' + encodeURIComponent(q + ' when:1d') + '&hl=en&gl=US&ceid=US:en', limit);
const safe = async (fn) => { try { return (await fn()) || []; } catch (e) { return []; } };

/* Local trends first, topped up with US/UK so the list is always English and full. */
async function googleTrendsEnglish(geo, want = 10) {
  let a = await rss('https://trends.google.com/trending/rss?geo=' + geo, 40);
  if (a.length < Math.min(want, 5)) {
    const more = await Promise.all(['US', 'GB'].filter((g) => g !== geo).map((g) => rss('https://trends.google.com/trending/rss?geo=' + g, 20)));
    a = uniqBy(a.concat(...more), (i) => i.title.toLowerCase());
    return { items: a.slice(0, want), label: geo + ' + US/UK' };
  }
  return { items: a.slice(0, want), label: geo };
}
async function trends24(path) {
  const h = await httpGet('https://trends24.in/' + path + '/');
  const out = [];
  if (h) {
    const seen = new Set();
    for (const m of h.matchAll(/class="trend-link"[^>]*>([^<]+)</g)) {
      const t = decode(m[1]).trim();
      if (!t || seen.has(t) || !isEnglish(t)) continue;
      seen.add(t);
      out.push(item(t, 'https://x.com/search?q=' + encodeURIComponent(t)));
    }
  }
  return out;
}

/* ---------- collectors ---------- */
async function buildSocial() {
  const { geo, ytkey } = settings();
  const [yt, xk, others] = await Promise.all([
    (async () => {
      if (!ytkey) return [];
      const d = await httpJson('https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&maxResults=15&regionCode=' + geo + '&key=' + encodeURIComponent(ytkey));
      return ((d && d.items) || []).map((v) => item(v.snippet.title, 'https://youtu.be/' + v.id,
        v.snippet.channelTitle + ' · ' + Number((v.statistics && v.statistics.viewCount) || 0).toLocaleString('en-US') + ' views'));
    })(),
    trends24('kuwait'),
    Promise.all([['TikTok', 'TikTok trend'], ['Instagram', 'Instagram trend'], ['Facebook', 'Facebook Meta trending'], ['LinkedIn', 'LinkedIn trending']]
      .map(async ([name, q]) => group(name, 'Google News (no public trending API)', await news(q)))),
  ]);
  const g = [];
  g.push(yt.length ? group('YouTube', 'YouTube Data API · most popular, ' + geo + ' (English titles)', yt.slice(0, 10))
    : group('YouTube', 'Google News (add a YouTube key in Settings for the live chart)', await news('YouTube trending video')));
  let x = xk, label = 'trends24.in · Kuwait (English only)';
  if (x.length < 8) {
    const more = await Promise.all([trends24('united-states'), trends24('united-kingdom')]);
    x = uniqBy(x.concat(...more), (i) => i.title.toLowerCase());
    label = 'trends24.in · Kuwait + US/UK (English only)';
  }
  x = x.slice(0, 12);
  if (x.length) g.push(group('X (Twitter)', label, x));
  else {
    const gt = await googleTrendsEnglish(geo, 10);
    g.push(group('X (Twitter)', 'Google Trends · ' + gt.label, gt.items));
  }
  return g.concat(others);
}

async function buildTech() {
  const [hn, tc, vg, ars] = await Promise.all([
    httpJson('https://hn.algolia.com/api/v1/search?tags=front_page&hitsPerPage=10'),
    rss('https://techcrunch.com/category/artificial-intelligence/feed/', 8),
    rss('https://www.theverge.com/rss/ai-artificial-intelligence/index.xml', 6),
    rss('https://feeds.arstechnica.com/arstechnica/index', 6),
  ]);
  const items = ((hn && hn.hits) || []).map((h) => item(h.title || '', h.url || 'https://news.ycombinator.com/item?id=' + h.objectID,
    (h.points ?? 0) + ' points · ' + (h.num_comments ?? 0) + ' comments'));
  return [group('Hacker News front page', 'Algolia HN API', items), group('AI news', 'TechCrunch AI', tc),
    group('AI news', 'The Verge AI', vg), group('Tech headlines', 'Ars Technica', ars)];
}

async function buildSell() {
  const { geo } = settings();
  const [a, b, c, d, e] = await Promise.all([
    rss('https://trends.google.com/trending/rss?geo=' + geo, 10),
    rss('https://trends.google.com/trending/rss?geo=US', 10),
    rss('https://www.producthunt.com/feed', 8),
    rss('https://www.reddit.com/r/dropship/top/.rss?t=day', 8),
    news('trending products to sell online ecommerce', 8),
  ]);
  return [group('Trending searches (demand signal)', 'Google Trends · ' + geo + ' (English only)', a), group('Trending searches · US', 'Google Trends · US', b),
    group('New products launching', 'Product Hunt', c), group('Dropshipping community', 'Reddit r/dropship top today', d),
    group('Trending products news', 'Google News', e)];
}

/* ----- High-paying remote jobs (free public feeds: Remotive, RemoteOK, Arbeitnow) ----- */
const HIGH_PAY = /(engineer|developer|architect|data |machine learning|\bml\b|\bai\b|devops|\bsre\b|security|product (manager|owner|lead)|manager|director|head of|\blead\b|principal|staff|\bvp\b|chief|finance|financial|analyst|scientist|cloud|solutions|sales (engineer|director))/i;

function salaryValue(text) {
  const s = String(text || '').replace(/,/g, '');
  const nums = [];
  for (const m of s.matchAll(/(\d+(?:\.\d+)?)\s*([kK])?/g)) {
    let v = parseFloat(m[1]);
    if (m[2]) v *= 1000;
    nums.push(v);
  }
  if (!nums.length) return 0;
  let v = Math.max(...nums);
  if (/hour|\/\s*hr|hourly/i.test(s) && v < 1000) v *= 2080;
  else if (/month|\/\s*mo\b/i.test(s) && v >= 500 && v < 60000) v *= 12;
  return v >= 10000 ? v : 0;
}
const money = (n) => '$' + (n >= 1000 ? Math.round(n / 1000) + 'k' : n);
function jobItem(j) {
  const sal = j.salaryText ? j.salaryText : '';
  return item(j.title, j.url, [j.company, j.location].filter(Boolean).join(' · ') + (j.source ? ' · via ' + j.source : ''),
    sal ? sal : 'Salary not listed', !sal);
}
async function buildJobs() {
  const [rem, rok, arb] = await Promise.all([
    httpJson('https://remotive.com/api/remote-jobs?limit=150'),
    httpJson('https://remoteok.com/api'),
    httpJson('https://www.arbeitnow.com/api/job-board-api'),
  ]);
  let jobs = [];
  ((rem && rem.jobs) || []).forEach((j) => jobs.push({
    title: j.title, company: j.company_name, url: j.url, source: 'Remotive',
    location: j.candidate_required_location || 'Remote', salaryText: (j.salary || '').trim(), val: salaryValue(j.salary) }));
  (Array.isArray(rok) ? rok : []).filter((j) => j && j.position).forEach((j) => {
    const mx = Number(j.salary_max || 0), mn = Number(j.salary_min || 0);
    jobs.push({ title: j.position, company: j.company, url: j.url || ('https://remoteok.com/remote-jobs/' + j.id), source: 'RemoteOK',
      location: j.location || 'Remote', salaryText: mx > 0 ? (mn > 0 ? money(mn) + ' – ' + money(mx) : 'Up to ' + money(mx)) : '', val: mx });
  });
  ((arb && arb.data) || []).filter((j) => j.remote !== false).forEach((j) => jobs.push({
    title: j.title, company: j.company_name, url: j.url, source: 'Arbeitnow',
    location: j.location || 'Remote', salaryText: '', val: 0 }));
  jobs = uniqBy(jobs.filter((j) => j.title && j.url && isEnglish(j.title) && isEnglish(j.company || '')), (j) => j.url);

  const paid = jobs.filter((j) => j.val >= 60000).sort((a, b) => b.val - a.val).slice(0, 12);
  const senior = jobs.filter((j) => j.val === 0 && HIGH_PAY.test(j.title)).slice(0, 8);
  const g = [];
  if (paid.length) g.push(group('Highest listed salaries', 'Remotive · RemoteOK (annual, as listed)', paid.map(jobItem)));
  if (senior.length) g.push(group('Senior and tech roles', 'Salary not listed · Remotive · RemoteOK · Arbeitnow', senior.map(jobItem)));
  return g;
}

function fmtPrice(p) { return Number(p || 0).toLocaleString('en-US', { maximumFractionDigits: 6 }); }
function coinLine(c) {
  const ch = c.price_change_percentage_24h ?? 0;
  return item(c.name + ' (' + String(c.symbol).toUpperCase() + ')', 'https://www.coingecko.com/en/coins/' + c.id,
    '$' + fmtPrice(c.current_price) + ' · ' + (ch >= 0 ? '+' : '') + ch.toFixed(1) + '% in 24h');
}
async function buildCrypto() {
  const [t, m, n] = await Promise.all([
    httpJson('https://api.coingecko.com/api/v3/search/trending'),
    httpJson('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&price_change_percentage=24h'),
    news('cryptocurrency market opportunity', 6),
  ]);
  const g = [];
  g.push(group('Trending coins', 'CoinGecko', ((t && t.coins) || []).map((c) => item(c.item.name + ' (' + c.item.symbol + ')',
    'https://www.coingecko.com/en/coins/' + c.item.id, 'Rank #' + (c.item.market_cap_rank ?? '?') + ' · most searched on CoinGecko'))));
  if (Array.isArray(m) && m.length) {
    const s = m.slice().sort((a, b) => (b.price_change_percentage_24h ?? 0) - (a.price_change_percentage_24h ?? 0));
    g.push(group('Top gainers (top 100 by market cap)', 'CoinGecko', s.slice(0, 8).map(coinLine)));
    g.push(group('Biggest drops (possible dip watch)', 'CoinGecko', s.slice().reverse().slice(0, 5).map(coinLine)));
  }
  g.push(group('Crypto news', 'Google News', n));
  return g;
}

async function buildGithub() {
  const g = [];
  const pages = await Promise.all([['daily', 'Trending today'], ['weekly', 'Trending this week']]
    .map(async ([since, label]) => [label, await httpGet('https://github.com/trending?since=' + since)]));
  for (const [label, h] of pages) {
    const items = [];
    if (h) {
      const arts = [...h.matchAll(/<article class="Box-row">([\s\S]*?)<\/article>/g)].slice(0, 10);
      for (const [, a] of arts) {
        const m = a.match(/<h2[^>]*>[\s\S]*?<a[^>]*href="([^"]+)"/);
        if (!m) continue;
        const path = m[1].trim();
        const d = a.match(/<p[^>]*>([\s\S]*?)<\/p>/);
        const desc = d ? stripTags(d[1]) : '';
        const l = a.match(/itemprop="programmingLanguage">([^<]+)</);
        const s = a.match(/([\d,]+)\s+stars\s+(today|this week)/);
        const meta = [l ? l[1].trim() : '', s ? s[1] + ' stars ' + s[2] : ''].filter(Boolean).join(' · ');
        items.push(item(path.replace(/^\//, '') + (desc ? ' — ' + desc : ''), 'https://github.com' + path, meta));
      }
    }
    if (items.length) g.push(group(label, 'github.com/trending', items));
  }
  if (!g.length) {
    const since = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
    const d = await httpJson('https://api.github.com/search/repositories?q=created:>' + since + '&sort=stars&order=desc&per_page=10', { Accept: 'application/vnd.github+json' });
    g.push(group('New repos this week', 'GitHub Search API', ((d && d.items) || []).map((r) =>
      item(r.full_name + ' — ' + (r.description || ''), r.html_url, (r.language || '') + ' · ' + r.stargazers_count + ' stars'))));
  }
  return g;
}

const SECTIONS = [
  { id: 'social', title: 'Trending on social media', fn: buildSocial },
  { id: 'tech', title: 'AI and technology', fn: buildTech },
  { id: 'sell', title: 'Trending to sell online', fn: buildSell },
  { id: 'jobs', title: 'High-paying remote jobs', fn: buildJobs, note: 'Salaries are shown as listed by the employer. Many senior roles do not list pay.' },
  { id: 'crypto', title: 'Crypto opportunities', fn: buildCrypto, note: 'Market data, not financial advice. Do your own research.' },
  { id: 'github', title: 'Trending on GitHub', fn: buildGithub },
];

/* ---------- rendering ---------- */
const CHEV = '<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function renderGroups(s) {
  let o = '', any = false;
  for (const g of s.groups) {
    if (!g.items || !g.items.length) continue;
    any = true;
    o += '<div class="group"><h3>' + esc(g.name) + '</h3><div class="src">' + esc(g.source) + '</div><ul class="rows">';
    for (const i of g.items) {
      const t = i.url ? '<a href="' + esc(i.url) + '" target="_blank" rel="noopener">' + esc(i.title) + '</a>' : esc(i.title);
      o += '<li dir="auto">' + t + (i.meta ? '<div class="sub">' + esc(i.meta) + '</div>' : '') +
        (i.badge ? '<span class="badge' + (i.badgeNone ? ' none' : '') + '">' + esc(i.badge) + '</span>' : '') + '</li>';
    }
    o += '</ul></div>';
  }
  if (!any) o += '<div class="empty">No data available right now. Tap Refresh to try again.</div>';
  if (s.note) o += '<p class="note">' + esc(s.note) + '</p>';
  return o;
}
function shell(sec) {
  return '<section class="card" id="sec-' + sec.id + '" data-id="' + sec.id + '"><header><h2>' + esc(sec.title) + '</h2><span class="state"></span>' + CHEV +
    '</header><div class="body"></div></section>';
}
function fill(id, html, state) {
  const el = $('sec-' + id);
  if (!el) return;
  el.querySelector('.body').innerHTML = html;
  el.querySelector('.state').textContent = state || '';
}
function stampText(ts) {
  try {
    return 'Updated ' + new Date(ts).toLocaleString('en-GB', { timeZone: 'Asia/Kuwait', weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', hour12: true }) + ' · Kuwait time';
  } catch (e) { return 'Updated ' + new Date(ts).toLocaleString(); }
}
function greeting() {
  let h = new Date().getHours();
  try { h = parseInt(new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kuwait', hour: 'numeric', hour12: false }).format(new Date()), 10) % 24; } catch (e) {}
  return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}

let busy = false, activeTab = 'all';
function applyTab() {
  document.querySelectorAll('#tabs .tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === activeTab));
  document.querySelectorAll('#out .card').forEach((c) => { c.style.display = (activeTab === 'all' || c.dataset.id === activeTab) ? '' : 'none'; });
}
async function load() {
  if (busy) return;
  busy = true;
  $('refresh').disabled = true;
  $('refresh').textContent = 'Refreshing…';
  $('stamp').textContent = 'Fetching the latest…';
  $('out').innerHTML = SECTIONS.map(shell).join('');
  applyTab();
  SECTIONS.forEach((s) => fill(s.id, '<div class="loading">Loading…</div>', ''));
  const result = {};
  await Promise.all(SECTIONS.map(async (s) => {
    const groups = await safe(s.fn);
    result[s.id] = { id: s.id, title: s.title, note: s.note, groups };
    fill(s.id, renderGroups(result[s.id]), '');
  }));
  const ts = Date.now();
  try { localStorage.setItem('mb:last2', JSON.stringify({ ts, result })); } catch (e) {}
  $('stamp').textContent = stampText(ts);
  $('refresh').disabled = false;
  $('refresh').textContent = 'Refresh';
  busy = false;
}
function showCached() {
  let c = null;
  try { c = JSON.parse(localStorage.getItem('mb:last2') || 'null'); } catch (e) {}
  if (!c || !c.result) return null;
  $('out').innerHTML = SECTIONS.map(shell).join('');
  SECTIONS.forEach((s) => c.result[s.id] && fill(s.id, renderGroups(c.result[s.id]), ''));
  applyTab();
  $('stamp').textContent = stampText(c.ts);
  return c.ts;
}

/* ---------- theme (light / dark / system) ---------- */
const ICON_SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function themeMode() { try { const m = localStorage.getItem('mb:theme'); return (m === 'light' || m === 'dark') ? m : 'system'; } catch (e) { return 'system'; } }
function systemDark() { try { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { return false; } }
function isDark() { const m = themeMode(); return m === 'dark' || (m === 'system' && systemDark()); }
function applyTheme(mode) {
  try { if (mode === 'system') localStorage.removeItem('mb:theme'); else localStorage.setItem('mb:theme', mode); } catch (e) {}
  const root = document.documentElement;
  if (mode === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', mode);
  refreshThemeUi();
}
function refreshThemeUi() {
  $('theme').innerHTML = isDark() ? ICON_SUN : ICON_MOON;   // shows what you will switch to
  $('theme').setAttribute('aria-label', isDark() ? 'Switch to light theme' : 'Switch to dark theme');
  $('themeColor').setAttribute('content', isDark() ? '#0f0f0f' : '#1a1a1a');
  document.querySelectorAll('#seg button').forEach((b) => b.classList.toggle('on', b.dataset.mode === themeMode()));
}
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', refreshThemeUi); } catch (e) {}

/* ---------- UI wiring ---------- */
document.addEventListener('click', (e) => {
  const h = e.target.closest('.card > header');
  if (h) h.parentElement.classList.toggle('collapsed');
});
$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab');
  if (!b) return;
  activeTab = b.dataset.tab;
  applyTab();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
$('refresh').addEventListener('click', () => load());
$('theme').addEventListener('click', () => applyTheme(isDark() ? 'light' : 'dark'));
$('seg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) applyTheme(b.dataset.mode); });
function toggleSettings(force) {
  const p = $('settings');
  const open = force === undefined ? p.style.display !== 'block' : force;
  p.style.display = open ? 'block' : 'none';
  if (open) { const s = settings(); $('geo').value = s.geo; $('ytkey').value = s.ytkey; refreshThemeUi(); p.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}
$('gear').addEventListener('click', () => toggleSettings());
$('cancel').addEventListener('click', () => toggleSettings(false));
$('save').addEventListener('click', () => {
  const geo = ($('geo').value || 'KW').trim().toUpperCase().slice(0, 2);
  try { localStorage.setItem('mb:settings', JSON.stringify({ geo, ytkey: $('ytkey').value.trim() })); } catch (e) {}
  toggleSettings(false);
  load();
});

$('greet').textContent = greeting();
refreshThemeUi();
const last = showCached();
if (!last || Date.now() - last > 3 * 3600 * 1000) load();
</script>
</body>
</html>
