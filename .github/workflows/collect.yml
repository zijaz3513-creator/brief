name: Collect trends

on:
  schedule:
    - cron: '7 * * * *'   # every hour
  workflow_dispatch:       # lets you run it now from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/collect.mjs
      - name: Save data
        run: |
          git config user.name "trends-bot"
          git config user.email "trends-bot@users.noreply.github.com"
          git add data/cache.json
          git diff --cached --quiet || git commit -m "Update trends data"
          git push
